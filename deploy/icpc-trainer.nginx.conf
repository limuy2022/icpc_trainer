server {
    listen 80;
    server_name icpc.limuy.top;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/icpc-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    # The existing stream listener forwards website TLS traffic to this port.
    listen 127.0.0.1:8443 ssl;
    server_name icpc.limuy.top;
    ssl_certificate /etc/letsencrypt/live/icpc.limuy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icpc.limuy.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    location / {
        proxy_pass http://127.0.0.1:18461;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_redirect off;
    }
}
